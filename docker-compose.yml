services:
  nmrih:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nmrih-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - nmrih-data:/home/steam/nmrih
    environment:
      SRCDS_PORT: ${SRCDS_PORT:-27015}
      SRCDS_MAP: ${SRCDS_MAP:-nmo_broadway}
      SRCDS_MAXPLAYERS: ${SRCDS_MAXPLAYERS:-8}
      SRCDS_HOSTNAME: ${SRCDS_HOSTNAME:-No More Room In Hell Server}
      RCON_PASSWORD: ${RCON_PASSWORD:-changeme}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      GSLT_TOKEN: ${GSLT_TOKEN:?GSLT_TOKEN is required}
    stdin_open: true
    tty: true

volumes:
  nmrih-data:
